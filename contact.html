    <section id="contact">
    <div class="container">
        <h2>Contact</h2>
        <p>Have a process that needs optimization? Let’s talk.</p>
        
        <form id="portfolioContactForm" class="contact-form">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" placeholder="Enter your name" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="email@example.com" required>
            </div>

            <div class="form-group">
                <label for="message">Your Message</label>
                <textarea id="message" rows="5" placeholder="Describe the process" required></textarea>
            </div>

            <button type="submit" class="submit-btn">Prepare</button>
        </form>
    </div>
</section>
